<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D2E"/>
      <stop offset="50%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>

    <!-- Brand Cyan-to-Blue Lightbar Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#388BFF"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>

    <!-- Radial Halo for ambient glow -->
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#388BFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind App Icon -->
  <circle cx="64" cy="58" r="54" fill="url(#halo)"/>

  <!-- Expressive Rounded Squircle Card -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bgGrad)" stroke="#2C314C" stroke-width="2"/>

  <!-- Inner Subtle Accent Border -->
  <rect x="9" y="9" width="110" height="110" rx="31" fill="none" stroke="#388BFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Controller Top Shell (DualSense White/Silver) -->
  <path d="M 32 36 
           C 40 28, 88 28, 96 36
           C 106 48, 114 82, 104 96
           C 96 106, 84 94, 76 78
           C 72 70, 56 70, 52 78
           C 44 94, 32 106, 24 96
           C 14 82, 22 48, 32 36 Z"
        fill="#E8ECF5" filter="url(#softGlow)"/>

  <!-- Controller Inner Grip Inset (Dark Obsidian) -->
  <path d="M 42 48
           C 48 42, 80 42, 86 48
           C 92 60, 96 84, 90 92
           C 85 98, 77 88, 72 76
           C 68 68, 60 68, 56 76
           C 51 88, 43 98, 38 92
           C 32 84, 36 60, 42 48 Z"
        fill="#12141F"/>

  <!-- Touchpad Surface -->
  <rect x="47" y="38" width="34" height="22" rx="6" fill="#1C1F30" stroke="#2C314C" stroke-width="1"/>

  <!-- Expressive Glowing Lightbar Wings around Touchpad -->
  <path d="M 45 37 C 45 52, 49 61, 51 62" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round" filter="url(#bloom)"/>
  <path d="M 83 37 C 83 52, 79 61, 77 62" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round" filter="url(#bloom)"/>

  <!-- D-Pad (Left) -->
  <g transform="translate(36, 56)">
    <circle cx="0" cy="0" r="8" fill="#1E2235"/>
    <rect x="-2" y="-6" width="4" height="12" rx="1.5" fill="#58A6FF"/>
    <rect x="-6" y="-2" width="12" height="4" rx="1.5" fill="#58A6FF"/>
  </g>

  <!-- PlayStation Action Symbols (Right) -->
  <g transform="translate(92, 56)">
    <circle cx="0" cy="0" r="8" fill="#1E2235"/>
    <!-- Triangle -->
    <circle cx="0" cy="-4" r="1.5" fill="#00E5FF"/>
    <!-- Circle -->
    <circle cx="4" cy="0" r="1.5" fill="#FF3B77"/>
    <!-- Cross -->
    <circle cx="0" cy="4" r="1.5" fill="#388BFF"/>
    <!-- Square -->
    <circle cx="-4" cy="0" r="1.5" fill="#E24AFF"/>
  </g>

  <!-- Left Thumbstick -->
  <circle cx="50" cy="74" r="7" fill="#0B0D13" stroke="#388BFF" stroke-width="2"/>
  <circle cx="50" cy="74" r="3.5" fill="#1C1F30"/>

  <!-- Right Thumbstick -->
  <circle cx="78" cy="74" r="7" fill="#0B0D13" stroke="#388BFF" stroke-width="2"/>
  <circle cx="78" cy="74" r="3.5" fill="#1C1F30"/>

  <!-- PS Home Button (Center) -->
  <ellipse cx="64" cy="69" rx="3" ry="2.5" fill="#2C314C"/>

  <!-- Player LEDs (Small vibrant cyan indicators) -->
  <circle cx="60" cy="62" r="0.9" fill="#00F0FF" filter="url(#bloom)"/>
  <circle cx="64" cy="62" r="1.1" fill="#00F0FF" filter="url(#bloom)"/>
  <circle cx="68" cy="62" r="0.9" fill="#00F0FF" filter="url(#bloom)"/>

  <!-- Mute Button Amber Indicator -->
  <rect x="62.5" y="65" width="3" height="1.8" rx="0.9" fill="#FF8C00" filter="url(#bloom)"/>
</svg>
