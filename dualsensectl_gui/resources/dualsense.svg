<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0070d1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Controller Shape -->
  <path d="M14 18 C16 12, 48 12, 50 18 C54 26, 60 48, 54 54 C48 60, 42 50, 38 42 C36 38, 28 38, 26 42 C22 50, 16 60, 10 54 C4 48, 10 26, 14 18 Z" 
        fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <!-- Glowing Lightbar V-shape -->
  <path d="M22 22 C28 26, 36 26, 42 22" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- D-Pad -->
  <circle cx="21" cy="32" r="6" fill="#21262d"/>
  <rect x="20" y="28" width="2" height="8" fill="#58a6ff" rx="1"/>
  <rect x="17" y="31" width="8" height="2" fill="#58a6ff" rx="1"/>

  <!-- Action Buttons (Cross, Circle, Triangle, Square) -->
  <circle cx="43" cy="32" r="6" fill="#21262d"/>
  <circle cx="43" cy="28" r="1" fill="#00f0ff"/>
  <circle cx="47" cy="32" r="1" fill="#ff3366"/>
  <circle cx="43" cy="36" r="1" fill="#00e676"/>
  <circle cx="39" cy="32" r="1" fill="#e040fb"/>

  <!-- Thumbsticks -->
  <circle cx="26" cy="42" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="38" cy="42" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- Mute Button LED -->
  <rect x="31" y="38" width="2" height="1.5" fill="#ff6b00" rx="0.5"/>
</svg>
